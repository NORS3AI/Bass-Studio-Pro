<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#0a0a0f"/>
  <rect x="16" y="16" width="480" height="480" rx="80" fill="#14141f" stroke="#6c5ce7" stroke-width="4"/>
  <!-- Speaker cone -->
  <g transform="translate(256,256)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#6c5ce7" stroke-width="6" opacity="0.25"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="#6c5ce7" stroke-width="4" opacity="0.4"/>
    <!-- Bass wave arcs -->
    <path d="M90,-50 Q140,0 90,50" fill="none" stroke="#6c5ce7" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
    <path d="M115,-80 Q180,0 115,80" fill="none" stroke="#7f70f0" stroke-width="12" stroke-linecap="round" opacity="0.7"/>
    <path d="M140,-110 Q220,0 140,110" fill="none" stroke="#9b8ff5" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
    <!-- Speaker body -->
    <rect x="-70" y="-45" width="60" height="90" rx="6" fill="#6c5ce7"/>
    <polygon points="-10,-45 55,-95 55,95 -10,45" fill="#6c5ce7"/>
    <!-- Inner glow -->
    <circle cx="-40" cy="0" r="16" fill="#9b8ff5" opacity="0.6"/>
  </g>
</svg>
